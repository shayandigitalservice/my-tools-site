<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shayan Smart Tools | India's No.1 Regional Land Area Calculator Hub</title>
    <meta name="description" content="India's trusted regional land area calculators. High-accuracy real-time conversions for Bigha, Kattha, Acre, Biswa, Ground, and Chatak across all Indian states. Safe, secure, and E-E-A-T optimized.">
    <link rel="canonical" href="https://shayansmarttools.in/index.html" />
    <link rel="icon" type="image/png" href="favicon.png">
    <meta name="google-site-verification" content="E6GgWqP2KmWb_kSzFJ5eNUkb0Xz131hJNFC2htHfxcY" />
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-SSDTZWC9RH"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-SSDTZWC9RH');
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
    
    <script type="text/javascript">
      document.addEventListener('contextmenu', event => event.preventDefault());
      document.onkeydown = function(e) {
        if(event.keyCode == 123) return false;
        if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false;
        if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
      }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
        body { background-color: #fcfcfc; color: #101828; line-height: 1.6; }

        /* Header Section */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 5%; background: transparent; 
            position: absolute; top: 0; left: 0; width: 100%; z-index: 1000;
        }
        .logo { display: flex; align-items: center; text-decoration: none; color: #ffffff !important; font-size: 20px; font-weight: bold; }
        .logo img { height: 28px; width: 28px; border-radius: 8px; margin-right: 12px; }
        .logo span { color: #45cafd; margin-left: 4px; }
        
        .nav-links { display: flex; gap: 15px; align-items: center; }
        .nav-links a { text-decoration: none; color: #ffffff !important; font-size: 13px; font-weight: 600; }
        .auth-group { display: flex; gap: 10px; align-items: center; margin-left: 10px; }
        .btn-login { text-decoration: none; color: #ffffff; font-size: 13px; font-weight: bold; padding: 6px 15px; border: 1px solid rgba(255,255,255,0.5); border-radius: 20px; }
        .btn-signup { text-decoration: none; background: #45cafd; color: white; font-size: 13px; font-weight: bold; padding: 6px 18px; border-radius: 20px; }
        .menu-toggle { display: none; font-size: 22px; cursor: pointer; color: #ffffff !important; }

        /* HERO SECTION WITH S-CURVE */
        .hero {
            position: relative; height: 350px; width: 100%;
            overflow: hidden; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; text-align: center; color: white;
            /* Yahan S-Curve ka magic hai */
            clip-path: url(#myClip); 
            -webkit-clip-path: path("M0,0 L1440,0 L1440,250 C1200,350 900,200 720,250 C540,300 240,150 0,250 Z");
            clip-path: path("M0,0 L1440,0 L1440,250 C1200,350 900,200 720,250 C540,300 240,150 0,250 Z");
        }
        
        .hero::after {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(16, 24, 40, 0.9) 0%, rgba(27, 38, 59, 0.7) 100%);
            z-index: 2;
        }

        .slider-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .slide {
            position: absolute; top: 0; left: 0; width: 100% !important; height: 100% !important;
            object-fit: cover; transform: translateX(100%);
            transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .slide.active { transform: translateX(0); }
        .slide.exit { transform: translateX(-100%); }

        .hero-content { position: relative; z-index: 3; max-width: 850px; width: 100%; padding: 0 20px; margin-top: 40px; }
        .hero h1 { font-size: 34px; margin-bottom: 10px; font-weight: bold; }
        .hero h1 span { color: #45cafd; }
        
        /* Baaki ka content aur footer same waisa hi hai jaisa aapne diya tha */
        /* (Maine yahan space bachane ke liye baaki styles remove kiye hain, aap apna purana style sheet yahan paste kar sakte hain) */
    </style>
</head>
<body>

<header>
    <a href="index.html" class="logo">
        <img src="favicon.png" alt="SHAYAN SMART TOOLS Logo">
        SHAYAN <span>SMART</span> <span>TOOLS</span>
    </a>
    <div class="menu-toggle" id="mobile-menu"><i class="fa-solid fa-bars"></i></div>
    <div class="nav-links" id="nav-list">
        <!-- Links -->
    </div>
</header>

<section class="hero" id="hero-slider">
    <div class="slider-container">
        <img src="https://images.unsplash.com/photo-1500382017468-9049fed747ef?q=80&w=1200" class="slide active" alt="Land">
        <img src="https://images.unsplash.com/photo-1592595896551-12b371d546d5?q=80&w=1200" class="slide" alt="Construction">
    </div>

    <div class="hero-content">
        <h1>India's No.1 <span>Land Calculator</span> & Micro-Utility Portal</h1>
        <p>High-accuracy algorithmic estimations for Bigha, Kattha, Biswa, and Acre plot measurements.</p>
    </div>
</section>

<!-- SVGs for Clip Path fallback -->
<svg width="0" height="0">
  <defs>
    <clipPath id="myClip" clipPathUnits="objectBoundingBox">
      <path d="M0,0 L1,0 L1,0.7 C0.8,0.9 0.6,0.6 0.5,0.7 C0.4,0.8 0.2,0.5 0,0.7 Z" />
    </clipPath>
  </defs>
</svg>

<script>
    // Slider JS code waisa hi rahega
    setInterval(() => {
        const slides = document.querySelectorAll('.slide');
        let current = [...slides].findIndex(s => s.classList.contains('active'));
        slides[current].classList.remove('active');
        slides[current].classList.add('exit');
        let next = (current + 1) % slides.length;
        slides[next].classList.remove('exit');
        slides[next].classList.add('active');
        setTimeout(() => { document.querySelectorAll('.slide.exit').forEach(el => el.classList.remove('exit')); }, 1200);
    }, 3000);
</script>

</body>
</html>
