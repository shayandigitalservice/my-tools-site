<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shayan POS - Professional Billing & Stock</title>
<link rel="manifest" href="manifest.json">
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log("Service Worker Registered"))
        .catch(err => console.log("SW Register Failed", err));
    });
  }
</script>

<style>
/* --- PROFESSIONAL UI (MODERN DESIGN) --- */
:root {
    --accent: #6366f1;
    --bg: #f8fafc;
    --glass: rgba(255, 255, 255, 0.95);
    --text: #0f172a;
    --blue-btn: #2563eb;
}

body { 
    font-family: 'Inter', Arial, sans-serif; 
    background: var(--bg); 
    margin: 0; 
    color: var(--text); 
    padding: 10px; 
}

h1 { 
    text-align: center; 
    background: linear-gradient(to right, #6366f1, #a855f7); 
    -webkit-background-clip: text; 
    -webkit-text-fill-color: transparent; 
    margin-top: 15px;
    margin-bottom: 20px;
}

input, select { 
    width: 100%; 
    padding: 12px; 
    margin: 6px 0; 
    border-radius: 8px; 
    border: 1px solid #ccc; 
    font-size: 15px; 
    box-sizing: border-box; 
    outline: none; 
}

.btn-blue { 
    width: 100%; 
    padding: 12px; 
    border-radius: 6px; 
    border: none; 
    background: var(--blue-btn); 
    color: white; 
    font-size: 15px; 
    font-weight: 500; 
    cursor: pointer; 
    margin: 5px 0; 
    transition: 0.2s; 
}

.btn-blue:hover { opacity: 0.9; }

/* --- BILLING UI CONTAINER --- */
.billing-ui-container { 
    max-width: 800px; 
    margin: auto; 
    background: #ffffff; 
    padding: 15px; 
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.05);
}

.billing-ui-container h2 { text-align: center; margin-bottom: 15px; font-size: 22px; }
table { width: 100%; margin-top: 10px; border-collapse: collapse; }
th, td { border: 1px solid #666; padding: 8px; font-size: 14px; text-align: center; }
.totalRow td { font-weight: bold; }
.bill { margin-top: 20px; overflow-wrap: break-word; word-wrap: break-word; border: 1px dashed #ccc; padding: 10px; }
.invoice { float: right; }
.clear { clear: both; }
.qr-container { text-align: center; margin-top: 15px; padding: 10px; border: 1px dashed #ccc; }
.qr-container img { width: 150px; height: 150px; }
.table-wrapper { overflow-x: auto; width: 100%; margin-bottom: 10px; }

/* Current Total Box Style */
.current-total-box {
    background: #f0f4ff;
    border: 1px solid #6366f1;
    border-radius: 12px;
    padding: 15px;
    margin: 15px 0;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    color: #0f172a;
}

/* Sale Summary Cards */
.sale-summary { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 15px; margin-bottom: 15px; }
.sale-card { background: #f1f5f9; padding: 10px; border-radius: 8px; text-align: center; border: 1px solid #e2e8f0; }
.sale-card span { display: block; font-size: 11px; color: #64748b; font-weight: bold; }
.sale-card b { font-size: 13px; color: #0f172a; }

@media screen and (max-width:600px){
  table th, table td { padding: 6px; font-size: 12px; }
  .invoice { float: none; text-align: right; }
}
</style>
</head>
<body>

<h1>Shayan Smart Billing</h1>

<div id="main-billing" class="billing-ui-container">
    <h2>🧾 Bill Generator</h2>

    <input id="shop" placeholder="Shop Name">
    <input id="address" placeholder="Address">
    <input id="phone" placeholder="Phone">
    <input id="upiId" placeholder="Enter Your UPI ID (e.g. name@upi)">
    <button id="saveShopBtn" class="btn-blue">Save Shop Details</button>

    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

    <input id="customer" placeholder="Customer Name">
    <input id="productSearch" placeholder="Search Product">
    <select id="productDropdown"></select>

    <input id="qty" type="number" placeholder="Qty">
    <input id="price" type="number" placeholder="Price">
    <button id="addItemBtn" class="btn-blue">Add Item</button>

    <div class="table-wrapper">
        <table id="table">
            <thead>
                <tr><th>No</th><th>Product</th><th>Qty</th><th>Price</th><th>Total</th></tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div class="current-total-box">
        Current Total: ₹<span id="liveCurrentTotal">0</span>
    </div>

    <input id="amtPaid" type="number" placeholder="Enter Amount Paid by Customer">
    <select id="payment">
      <option value="Cash">Cash</option>
      <option value="UPI">UPI</option>
      <option value="Card">Card</option>
    </select>

    <button id="generateBillBtn" class="btn-blue" style="background:#2563eb;">Generate Bill</button>
    <select id="printMode">
        <option value="A4">Print A4</option>
        <option value="Receipt" selected>Print Receipt</option>
    </select>
    <button id="printBillBtn" class="btn-blue">Print Bill</button>
    <button id="sendWhatsAppBtn" class="btn-blue">Send WhatsApp</button>

    <div id="bill" class="bill"></div>
    
    <button id="downloadHistoryBtn" class="btn-blue" style="margin-top: 15px;">Download History</button>
    
    <div class="sale-summary">
        <div class="sale-card"><span>Today</span><b id="saleToday">₹0</b></div>
        <div class="sale-card"><span>Weekly</span><b id="saleWeekly">₹0</b></div>
        <div class="sale-card"><span>Monthly</span><b id="saleMonthly">₹0</b></div>
    </div>

    <hr style="margin:30px 0;">
    <h2 style="display:flex; align-items:center; justify-content:center; gap:10px;">📦 Stock Management</h2>

    <input id="stockProduct" placeholder="Product Name">
    <input id="stockQty" type="number" placeholder="Quantity to Add">
    <button id="addStockBtn" class="btn-blue">Add Stock</button>

    <div class="table-wrapper">
        <table id="stockTable">
            <tr><th>Product</th><th>Available Qty</th><th>Last Updated</th></tr>
        </table>
    </div>

    <button id="downloadStockBtn" class="btn-blue">Download Stock Excel</button>
</div>

<script>
document.addEventListener("DOMContentLoaded", function(){
    initBillingSystem();
});

// --- BILLING SYSTEM CORE ---
function initBillingSystem() {
    let items = [];
    let total = 0;
    let liveTotal = 0; // Tracking live total for the UI box
    let invoiceCounter = parseInt(localStorage.getItem("invoiceCounter")) || 1;
    let stock = JSON.parse(localStorage.getItem("stock")) || {};
    let stockHistory = JSON.parse(localStorage.getItem("stockHistory")) || [];

    const shopInput = document.getElementById("shop");
    const addressInput = document.getElementById("address");
    const phoneInput = document.getElementById("phone");
    const upiInput = document.getElementById("upiId");
    const saveShopBtn = document.getElementById("saveShopBtn");
    const liveTotalDisplay = document.getElementById("liveCurrentTotal");

    // Load saved shop details
    shopInput.value = localStorage.getItem("shop") || "";
    addressInput.value = localStorage.getItem("address") || "";
    phoneInput.value = localStorage.getItem("phone") || "";
    upiInput.value = localStorage.getItem("upiId") || "";

    saveShopBtn.addEventListener("click", function(){
        localStorage.setItem("shop", shopInput.value);
        localStorage.setItem("address", addressInput.value);
        localStorage.setItem("phone", phoneInput.value);
        localStorage.setItem("upiId", upiInput.value);
        alert("Shop details saved!");
    });

    const stockProductInput = document.getElementById("stockProduct");
    const stockQtyInput = document.getElementById("stockQty");
    const addStockBtn = document.getElementById("addStockBtn");
    const stockTable = document.getElementById("stockTable");

    function renderStock(){
        stockTable.innerHTML = `<tr><th>Product</th><th>Available Qty</th><th>Last Updated</th></tr>`;
        for(let p in stock){
            let updates = stockHistory.filter(h => h.product === p);
            let lastUpdate = updates[updates.length - 1]?.date || "";
            let color = stock[p] <= 5 ? "red" : "green";
            let row = stockTable.insertRow();
            row.insertCell(0).innerHTML = p + (stock[p] <= 5 ? " ⚠ Low Stock" : "");
            row.insertCell(1).innerHTML = `<span style="color:${color}">${stock[p]}</span>`;
            row.insertCell(2).innerText = lastUpdate ? new Date(lastUpdate).toLocaleString() : "-";
        }
    }
    renderStock();

    addStockBtn.addEventListener("click", function(){
        let p = stockProductInput.value.trim();
        let q = +stockQtyInput.value;
        if(!p || !q){ alert("Fill all fields"); return; }
        stock[p] = (stock[p] || 0) + q;
        stockHistory.push({product:p, qtyAdded:q, type:"Added", date:new Date().toISOString()});
        localStorage.setItem("stock", JSON.stringify(stock));
        localStorage.setItem("stockHistory", JSON.stringify(stockHistory));
        stockProductInput.value = ""; 
        stockQtyInput.value = "";
        renderStock();
        renderProductDropdown();
    });

    const productDropdown = document.getElementById("productDropdown");
    const productSearch = document.getElementById("productSearch");

    function renderProductDropdown(){
        productDropdown.innerHTML = "";
        let productList = [...new Set(Object.keys(stock))];
        productList.forEach(p => {
            let option = document.createElement("option");
            option.value = p; 
            option.text = p;
            productDropdown.appendChild(option);
        });
    }
    renderProductDropdown();

    productSearch.addEventListener("input", function(){
        let val = this.value.toLowerCase();
        let options = Array.from(productDropdown.options);
        let match = options.find(o => o.value.toLowerCase().includes(val));
        if(match) productDropdown.value = match.value;
    });

    document.getElementById("downloadStockBtn").addEventListener("click", function(){
        let html = `<table border="1"><tr><th>Product</th><th>Available Qty</th><th>Last Updated</th></tr>`;
        for(let p in stock){
            let updates = stockHistory.filter(h => h.product === p);
            let lastUpdate = updates[updates.length - 1]?.date || "";
            html += `<tr><td>${p}</td><td>${stock[p]}</td><td>${lastUpdate ? new Date(lastUpdate).toLocaleString() : '-'}</td></tr>`;
        }
        html += `</table>`;
        let blob = new Blob([html], {type: "application/vnd.ms-excel"});
        let a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "stock.xlsx";
        a.click();
    });

    const qtyInput = document.getElementById("qty");
    const priceInput = document.getElementById("price");
    const addItemBtn = document.getElementById("addItemBtn");
    const tableBody = document.getElementById("tableBody");

    addItemBtn.addEventListener("click", function(){
        let p = productDropdown.value.trim();
        let q = +qtyInput.value;
        let pr = +priceInput.value;
        if(!p || !q || !pr){ alert("Fill all fields"); return; }
        if(stock[p] === undefined){ alert("Product not in stock"); return; }
        if(q > stock[p]){ alert(`Stock not sufficient for ${p}. Available: ${stock[p]}`); return; }

        stock[p] -= q;
        stockHistory.push({product:p, qtyAdded:-q, type:"Sold", date:new Date().toISOString()});
        localStorage.setItem("stock", JSON.stringify(stock));
        localStorage.setItem("stockHistory", JSON.stringify(stockHistory));
        renderStock();

        let t = q * pr;
        items.push({p, q, pr, t});
        
        // Update live total display
        liveTotal += t;
        liveTotalDisplay.innerText = liveTotal;

        let row = tableBody.insertRow();
        row.insertCell(0).innerText = items.length;
        row.insertCell(1).innerText = p;
        row.insertCell(2).innerText = q;
        row.insertCell(3).innerText = pr;
        row.insertCell(4).innerText = t;
        
        productSearch.value = ""; 
        qtyInput.value = ""; 
        priceInput.value = "";
    });

    function getInvoiceNumber(){ 
        let num = invoiceCounter; 
        invoiceCounter++; 
        localStorage.setItem("invoiceCounter", invoiceCounter); 
        return num; 
    }

    document.getElementById("generateBillBtn").addEventListener("click", function(){
        if(items.length === 0){ alert("Add items first"); return; }
        let bill = document.getElementById("bill");
        total = 0; 
        items.forEach(i => total += i.t);
        
        let paid = parseFloat(document.getElementById("amtPaid").value) || total;
        let unpaid = total - paid;
        if(unpaid < 0) unpaid = 0;

        let invoiceNo = getInvoiceNumber();
        let dateISO = new Date().toISOString();
        let paymentMode = document.getElementById("payment").value;
        let upiId = upiInput.value.trim();

        let html = `<div class="invoice">Invoice No: ${invoiceNo}</div><div class="clear"></div>
        <b>${shopInput.value}</b><br>${addressInput.value}<br>Phone: ${phoneInput.value}<br>
        Date: ${new Date(dateISO).toLocaleString()}<br>
        Customer: ${document.getElementById("customer").value || 'Walk-in Customer'}<br>
        Payment Mode: ${paymentMode}<hr>
        <div style="overflow-x:auto;"><table>
        <tr><th>No</th><th>Item</th><th>Qty</th><th>Price</th><th>Total</th></tr>`;
        
        items.forEach((i, index) => {
            html += `<tr><td>${index + 1}</td><td>${i.p}</td><td>${i.q}</td><td>${i.pr}</td><td>${i.t}</td></tr>`;
        });
        
        html += `<tr class="totalRow"><td colspan="4">Grand Total</td><td>₹${total}</td></tr>`;
        html += `<tr class="totalRow" style="color:green;"><td colspan="4">Paid Amount</td><td>₹${paid}</td></tr>`;
        html += `<tr class="totalRow" style="color:red;"><td colspan="4">Unpaid Balance</td><td>₹${unpaid}</td></tr></table></div>`;
        
        if(upiId !== "" && paid > 0){
            let qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent('upi://pay?pa='+upiId+'&pn='+shopInput.value+'&am='+paid+'&cu=INR')}`;
            html += `<div class="qr-container"><p>Scan to Pay: ₹${paid}</p><img src="${qrUrl}" alt="UPI QR Code"></div>`;
        }

        bill.innerHTML = html;

        let saleHistory = JSON.parse(localStorage.getItem("saleHistory")) || [];
        saleHistory.push({ invoiceNo, total, paid, unpaid, date: dateISO, customer: document.getElementById("customer").value || 'Walk-in', items: [...items] });
        localStorage.setItem("saleHistory", JSON.stringify(saleHistory));

        updateSaleSummary();
        items = [];
        tableBody.innerHTML = "";
        document.getElementById("amtPaid").value = "";
        
        // Reset Live Total after generating bill
        liveTotal = 0;
        liveTotalDisplay.innerText = "0";
    });

    document.getElementById("printBillBtn").addEventListener("click", function(){
        let content = document.getElementById("bill").innerHTML;
        if(!content) return alert("Generate bill first");
        let mode = document.getElementById("printMode").value;
        let width = 400, height = 700;
        if(mode == "A4"){ width = 800; height = 1100; }
        let win = window.open('', '', `width=${width},height=${height}`);
        win.document.write(`<html><head><title>Print Bill</title><style>
        body{font-family:monospace;padding:10px;text-align:center;} table{width:100%;border-collapse:collapse;} td,th{border:1px solid #000;padding:5px;text-align:center;} .totalRow td{font-weight:bold;} .invoice{float:right;} .clear{clear:both;} .qr-container{margin-top:10px;} .qr-container img{width:120px;}
        </style></head><body>${content}</body></html>`);
        win.document.close(); 
        win.print();
    });

    document.getElementById("sendWhatsAppBtn").addEventListener("click", function(){
        let text = "🧾 BILL RECEIPT\n\n" + document.getElementById("bill").innerText;
        window.open("https://wa.me/?text=" + encodeURIComponent(text));
    });

    document.getElementById("downloadHistoryBtn").addEventListener("click", function(){
        let saleHistory = JSON.parse(localStorage.getItem("saleHistory")) || [];
        if(saleHistory.length === 0) return alert("No history found");
        let html = `<table border="1"><tr><th>Date</th><th>Invoice</th><th>Customer</th><th>Total</th><th>Paid</th><th>Unpaid</th></tr>`;
        saleHistory.forEach(s => {
            html += `<tr><td>${new Date(s.date).toLocaleDateString()}</td><td>${s.invoiceNo}</td><td>${s.customer}</td><td>${s.total}</td><td>${s.paid}</td><td>${s.unpaid}</td></tr>`;
        });
        html += `</table>`;
        let blob = new Blob([html], {type: "application/vnd.ms-excel"});
        let a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "Sale_History.xlsx"; 
        a.click();
    });

    function updateSaleSummary(){
        let history = JSON.parse(localStorage.getItem("saleHistory")) || [];
        let today = new Date();
        let tTotal = 0, wTotal = 0, mTotal = 0;
        history.forEach(s => {
            let sDate = new Date(s.date);
            if(sDate.toDateString() === today.toDateString()) tTotal += s.total;
            let diffDays = Math.ceil(Math.abs(today - sDate) / (1000 * 60 * 60 * 24));
            if(diffDays <= 7) wTotal += s.total;
            if(sDate.getMonth() === today.getMonth() && sDate.getFullYear() === today.getFullYear()) mTotal += s.total;
        });
        document.getElementById("saleToday").innerText = "₹" + tTotal;
        document.getElementById("saleWeekly").innerText = "₹" + wTotal;
        document.getElementById("saleMonthly").innerText = "₹" + mTotal;
    }
    updateSaleSummary();
}
</script>
</body>
</html>
