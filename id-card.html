<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro School ID Card Generator</title>

<!-- Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #e0e7ff, #f1f5f9);
    padding: 20px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 30px;
}

.container {
    width: 100%;
    max-width: 450px;
    background: white;
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

.container h2 {
    margin-bottom: 15px;
    color: #1e293b;
    font-size: 22px;
}

.form-group {
    margin-bottom: 10px;
    text-align: left;
}

.form-group label {
    font-size: 12px;
    font-weight: 600;
    color: #475569;
    display: block;
    margin-bottom: 3px;
}

input, select {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
}

input:focus, select:focus {
    border-color: #2563eb;
}

.btn-group {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

button {
    flex: 1;
    padding: 12px;
    border: none;
    background: #2563eb;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    transition: background 0.2s;
}

button:hover {
    background: #1d4ed8;
}

/* --- ID CARD DESIGN --- */
.preview-area {
    display: flex;
    flex-direction: column;
    align-items: center;
}

#card {
    width: 420px;
    height: 270px;
    border-radius: 16px;
    background: white;
    box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    position: relative;
    overflow: hidden;
    border: 1px solid #e2e8f0;
}

/* Watermark */
.watermark {
    position: absolute;
    top: 50%;
    left: 55%;
    transform: translate(-50%, -50%);
    opacity: 0.05;
    pointer-events: none;
    z-index: 1;
}
.watermark img {
    width: 180px;
    height: 180px;
    object-fit: contain;
}

/* Header */
.topbar {
    background: #2563eb;
    color: white;
    padding: 10px 15px 10px 65px;
    text-align: center;
    position: relative;
    min-height: 60px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.school-logo {
    position: absolute;
    left: 12px;
    top: 8px;
    width: 44px;
    height: 44px;
    object-fit: contain;
    background: #fff;
    border-radius: 50%;
    padding: 2px;
}

.school-name {
    font-size: 16px;
    font-weight: 700;
    line-height: 1.2;
    text-transform: uppercase;
}

.school-address {
    font-size: 10px;
    opacity: 0.9;
    margin-top: 2px;
}

.card-title {
    background: #0f172a;
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-align: center;
    padding: 3px 0;
}

/* Body Layout */
.card-body {
    display: flex;
    padding: 12px 15px;
    position: relative;
    z-index: 2;
}

.photo-box {
    width: 95px;
    height: 115px;
    border: 2px solid #cbd5e1;
    border-radius: 8px;
    overflow: hidden;
    background: #f8fafc;
    flex-shrink: 0;
}

.photo-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.details {
    margin-left: 15px;
    font-size: 12px;
    color: #1e293b;
    line-height: 1.5;
    flex-grow: 1;
}

.details table {
    width: 100%;
    border-collapse: collapse;
}

.details td {
    padding: 1px 0;
    vertical-align: top;
}

.details td.label {
    font-weight: 600;
    width: 65px;
    color: #475569;
}

/* Footer elements */
.qrcode-box {
    position: absolute;
    bottom: 30px;
    right: 110px;
}

.signature {
    position: absolute;
    right: 15px;
    bottom: 28px;
    text-align: center;
    font-size: 9px;
    font-weight: 600;
    color: #334155;
}

.signature img {
    width: 70px;
    height: 25px;
    object-fit: contain;
    display: block;
    margin: 0 auto;
}

.bottombar {
    position: absolute;
    bottom: 0;
    width: 100%;
    background: #2563eb;
    color: white;
    text-align: center;
    padding: 4px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.5px;
}
</style>
</head>

<body>

<div class="container">
    <h2>ID Card Details</h2>
    
    <div class="form-group"><label>School Name</label><input id="school" value="Delhi Public School" oninput="updateText()"></div>
    <div class="form-group"><label>School Address</label><input id="address" value="Sector 4, New Delhi" oninput="updateText()"></div>
    <div class="form-group"><label>Student Name</label><input id="name" value="Rahul Sharma" oninput="updateText()"></div>
    <div class="form-group"><label>Father's Name</label><input id="father" value="Rajesh Sharma" oninput="updateText()"></div>
    
    <div style="display:flex; gap:10px;">
        <div class="form-group" style="flex:1;"><label>Class</label><input id="class" value="10th" oninput="updateText()"></div>
        <div class="form-group" style="flex:1;"><label>Section</label><input id="section" value="A" oninput="updateText()"></div>
        <div class="form-group" style="flex:1;"><label>Roll No</label><input id="roll" value="25" oninput="updateText()"></div>
    </div>

    <div class="form-group"><label>Phone Number</label><input id="phone" value="+91 9876543210" oninput="updateText()"></div>
    <div class="form-group"><label>Session</label><input id="session" value="2025-2026" oninput="updateText()"></div>

    <div class="form-group">
        <label>Theme Color</label>
        <select id="colorSelect" onchange="updateColor()">
            <option value="#2563eb">Blue</option>
            <option value="#b91c1c">Red</option>
            <option value="#047857">Green</option>
            <option value="#7c3aed">Purple</option>
            <option value="#0ea5e9">Sky Blue</option>
            <option value="#ea580c">Orange</option>
        </select>
    </div>

    <div class="form-group"><label>School Logo</label><input type="file" id="logoUpload" accept="image/*" onchange="loadImg(this, 'logoPreview')"></div>
    <div class="form-group"><label>Student Photo</label><input type="file" id="photoUpload" accept="image/*" onchange="loadImg(this, 'photoPreview')"></div>
    <div class="form-group"><label>Principal Signature</label><input type="file" id="signUpload" accept="image/*" onchange="loadImg(this, 'signPreview')"></div>

    <div class="btn-group">
        <button onclick="downloadCard()">Download Card</button>
    </div>
</div>

<!-- PREVIEW AREA -->
<div class="preview-area">
    <div id="card">
        <div class="watermark">
            <img id="watermarkLogo" src="">
        </div>

        <div class="topbar">
            <img id="logoPreview" class="school-logo" src="https://via.placeholder.com/50" alt="Logo">
            <div class="school-name" id="schoolPreview">Delhi Public School</div>
            <div class="school-address" id="addressPreview">Sector 4, New Delhi</div>
        </div>

        <div class="card-title">STUDENT IDENTITY CARD</div>

        <div class="card-body">
            <div class="photo-box">
                <img id="photoPreview" src="https://via.placeholder.com/100x120" alt="Photo">
            </div>

            <div class="details">
                <table>
                    <tr><td class="label">Name</td><td>: <span id="namePreview">Rahul Sharma</span></td></tr>
                    <tr><td class="label">Father</td><td>: <span id="fatherPreview">Rajesh Sharma</span></td></tr>
                    <tr><td class="label">Class</td><td>: <span id="classPreview">10th</span> (<span id="sectionPreview">A</span>)</td></tr>
                    <tr><td class="label">Roll No</td><td>: <span id="rollPreview">25</span></td></tr>
                    <tr><td class="label">Phone</td><td>: <span id="phonePreview">+91 9876543210</span></td></tr>
                </table>
            </div>
        </div>

        <div id="qrcode" class="qrcode-box"></div>

        <div class="signature">
            <img id="signPreview" src="https://via.placeholder.com/70x25?text=Sign" alt="Sign">
            <span>Principal</span>
        </div>

        <div class="bottombar">
            <span id="sessionPreview">SESSION 2025-2026</span>
        </div>
    </div>
</div>

<script>
// Auto QR Generator Object
let qrCodeObj = null;

window.onload = function() {
    qrCodeObj = new QRCode(document.getElementById("qrcode"), {
        text: "Rahul Sharma | Roll: 25",
        width: 40,
        height: 40
    });
    updateText();
};

// Real-time Text Update Function
function updateText() {
    document.getElementById("schoolPreview").innerText = document.getElementById("school").value || "School Name";
    document.getElementById("addressPreview").innerText = document.getElementById("address").value || "School Address";
    document.getElementById("namePreview").innerText = document.getElementById("name").value || "Student Name";
    document.getElementById("fatherPreview").innerText = document.getElementById("father").value || "Father Name";
    document.getElementById("classPreview").innerText = document.getElementById("class").value || "-";
    document.getElementById("sectionPreview").innerText = document.getElementById("section").value || "-";
    document.getElementById("rollPreview").innerText = document.getElementById("roll").value || "-";
    document.getElementById("phonePreview").innerText = document.getElementById("phone").value || "-";
    document.getElementById("sessionPreview").innerText = "SESSION " + (document.getElementById("session").value || "2025-2026");

    // Dynamic QR Update
    let qrData = `Name: ${document.getElementById("name").value}, Roll: ${document.getElementById("roll").value}, Ph: ${document.getElementById("phone").value}`;
    qrCodeObj.clear();
    qrCodeObj.makeCode(qrData);
}

// Color Change
function updateColor() {
    let color = document.getElementById("colorSelect").value;
    document.querySelector(".topbar").style.background = color;
    document.querySelector(".bottombar").style.background = color;
}

// Image Loader Helper
function loadImg(input, targetId) {
    if (input.files && input.files[0]) {
        let reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById(targetId).src = e.target.result;
            if(targetId === 'logoPreview') {
                document.getElementById('watermarkLogo').src = e.target.result;
            }
        };
        reader.readAsDataURL(input.files[0]);
    }
}

// Direct Download Function
function downloadCard() {
    let card = document.getElementById("card");
    
    html2canvas(card, {
        scale: 3, // High DPI resolution for clear print
        useCORS: true
    }).then(canvas => {
        let link = document.createElement('a');
        link.download = (document.getElementById("name").value || "Student") + '_ID_Card.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    });
}
</script>

</body>
</html>
